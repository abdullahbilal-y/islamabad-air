[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hawa"
version = "0.1.0"
description = "Open pollen and air-quality API for Islamabad — digitises PMD's daily sector-wise pollen counts and community AQ sensors."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hawa contributors" }]
keywords = ["pollen", "air-quality", "islamabad", "pakistan", "pmd", "aqi", "open-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "sqlmodel>=0.0.22",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "apscheduler>=3.10,<4",
  "jinja2>=3.1",
  "selectolax>=0.3.21",
  "typer>=0.12",
  "tzdata>=2024.1",  # ZoneInfo("Asia/Karachi") has no system tz database on Windows
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-python-dateutil",
]

[project.scripts]
hawa = "hawa.cli:app"

[project.urls]
Homepage = "https://github.com/abdullahbilal-y/islamabad-air"
Issues = "https://github.com/abdullahbilal-y/islamabad-air/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hawa"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
files = ["src/hawa"]
ignore_missing_imports = true
warn_unused_ignores = true
