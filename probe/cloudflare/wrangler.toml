name = "pmd-egress-probe"
main = "src/worker.js"
compatibility_date = "2024-09-01"

# Smart Placement was tested here and did NOT help: three consecutive cron runs
# all fired from FRA and were refused. The likely reason is that PMD is itself
# Cloudflare-proxied, so from Cloudflare's routing view the origin is reachable
# at every edge and there is no latency case for relocating the Worker.
# Left recorded rather than deleted, so nobody re-runs this experiment.
[placement]
mode = "smart"

[[kv_namespaces]]
binding = "PROBE"
id = "724c7634e4d94c1c865b2e0c8a7cf109"

# No [triggers]. The cron question is answered, and leaving a 2-minute schedule
# in place would send PMD ~700 pointless requests a day for nothing.
